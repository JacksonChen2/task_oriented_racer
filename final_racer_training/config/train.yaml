algorithm:
  variant: portable_phaoi_z_source_owned_bs_ofdma_u2u_csma_unmasked_v1
seed: 42
n_uavs: 10
actor:
  # Constant hard mask and episode schedule are alternative modes, both off by default.
  mask_no_link_actions: false
  no_link_logit_schedule:
    enabled: false
    total_episodes: 50
    max_penalty: 12.0
  include_exploration_phase: false
  initial_action_probability: 0.8
  no_link_logit_penalty: 0.0
qwen:
  enabled: true
  model_path: ${QWEN_MODEL_PATH}
  backend: vllm
  device: auto
  dtype: bfloat16
  local_files_only: true
  max_new_tokens: 1024
  normalize_omega: true
  dequantize_fp8: false
  async_llm: false
  load_in_8bit: false
  load_in_4bit: false
  prompt_variant: compact_nonzero_schema
  vllm:
    quantization: fp8
    linear_backend: cutlass
    gpu_memory_utilization: 0.25
    max_model_len: 8192
    max_num_seqs: 1
    enforce_eager: false
    enable_prefix_caching: false
    disable_deep_gemm: true
    disable_flashinfer_sampler: true
    seed: 42
  single_gpu_pause:
    enabled: false
    request_path: /tmp/final_racer_event_one_shot/pause_request.json
    acknowledgement_path: /tmp/final_racer_event_one_shot/pause_ack.json
    timeout_s: 600.0
    poll_interval_s: 0.01
llm_action_prior:
  enabled: true
  relay_beta: 0.5
  upload_beta: 0.5
  clip: 2.0
  initial_gate: 0.5
environment:
  observation_layout: phaoi_z
  include_global_guidance: true
  high_level_interval: 250
  channel_history: 50
  resource_normalizer: 5000.0
  backend:
    kind: shared_memory_event_driven_one_shot
    shared_memory_root: null
    # Supply a local reference via RACER_QWEN8_PERFECT_RESULT; no data is distributed.
    perfect_reference_result: null
    require_perfect_reference: true
    redundancy_cell_m: 1.0
    fixed_exploration_time_s: 300.0
    require_auxiliary_reference_metrics: true
    horizon: 128
    mock_direct_u2u_resource: 11.0
  normalization:
    position_min:
    - -27.0
    - 0.6
    - 0.4
    position_max:
    - 6.0
    - 30.6
    - 8.4
    snr_min_db: -20.0
    snr_max_db: 40.0
    max_aoi_s: 30.0
    max_missing_bytes: 4000000.0
    max_queue_bytes: 4000000.0
reward:
  type: negative_bs_resource
  scale: 1.0
  no_link_prb_per_action: 200.0
task_loss:
  alpha_traj: 0.1
  alpha_cov: 0.4
  alpha_red: 0.2
  alpha_map: 0.3
constraint:
  type: task_loss
  calibration_mode: manual
  rho: 0.25
  gamma_task: 0.15
  eta: 0.0
  distributed_only_results: []
  full_bs_results: []
  episode_duration_s: 300.0
  telescoping_tolerance: 1.0e-06
crpo:
  gamma_reward: 0.99
  gamma_cost: 1.0
  gae_lambda_reward: 0.98
  gae_lambda_cost: 0.98
  constraint_estimator: time_weighted_mean
  episode_cost_window: 30
  ppo:
    learning_rate: 0.0001
    n_steps: 256
    batch_size: 64
    n_epochs: 5
    activation_fn: silu
    clip_range: 0.2
    ent_coef: 0.001
    reward_vf_coef: 0.5
    cost_vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl: 0.1
    normalize_advantage: true
    net_arch:
      pi:
      - 128
      vf:
      - 128
training:
  mode: train
  device: cpu
  total_timesteps: 250000
  smoke_timesteps: 64
  checkpoint_interval: 10000
  output_dir: ../../results/default/training
  verbose: 1
experiment:
  episodes: 60
  episode_duration_s: 300
  bs_channel_access_mode: ofdma
  u2u_channel_access_mode: csma
  uav_tx_power_dbm: 23
  bs_tx_power_dbm: 33
  bs_downlink_source_owned_chunks_only: true
  bs_downlink_newest_missing_chunk_first: false
